{% if role == 'admin' and classes %}
<form method="get" class="filtre-classe no-print">
  {% for k, v in request.args.items() if k != 'classe' %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
  <label for="f-classe">Classe :</label>
  <select id="f-classe" name="classe" onchange="this.form.submit()">
    <option value="">Toutes les classes</option>
    {% for c in classes %}<option value="{{ c.id }}" {{ 'selected' if classe_choisie == c.id|string }}>{{ c.classe }} · {{ c.nom }}</option>{% endfor %}
    <option value="0" {{ 'selected' if classe_choisie == '0' }}>Sans classe</option>
  </select>
</form>
{% endif %}
