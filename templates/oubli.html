{% extends "base.html" %}
{% block titre %}Mot de passe oublié · Digital Kids{% endblock %}
{% block qui %}<a class="btn-lien" href="{{ url_for('animateur_connexion') }}">← Connexion</a>{% endblock %}
{% block contenu %}
<form class="carte form-connexion" method="post" style="max-width:460px;margin:0 auto" autocomplete="off">
  <span class="pastille" style="justify-self:start">MOT DE PASSE OUBLIÉ</span>
  <h1 style="font-size:28px;color:var(--nuit)">Nouveau mot de passe</h1>
  {% if erreur %}<div class="erreur">{{ erreur }}</div>{% endif %}
  <label for="identifiant">Identifiant</label>
  <input type="text" id="identifiant" name="identifiant" required autocapitalize="none" spellcheck="false" placeholder="ex. toky">
  <label for="secours">Code de secours</label>
  <input type="password" id="secours" name="secours" required>
  <label for="mot_de_passe">Nouveau mot de passe</label>
  <input type="password" id="mot_de_passe" name="mot_de_passe" required minlength="6">
  <label for="confirmation">Écrivez-le une 2e fois</label>
  <input type="password" id="confirmation" name="confirmation" required minlength="6">
  <button class="btn bleu" type="submit">Changer mon mot de passe ➜</button>
</form>
{% endblock %}
